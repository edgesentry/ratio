name: Dependency Review

on:
  pull_request:

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Submit dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@9c110eb34dee187cd9eca76a652b9f6a0ed22927  # v0.1.1
        continue-on-error: true

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          retry-on-snapshot-warnings: true
          fail-on-severity: high
          # Dual SPDX expressions (A AND B) require every conjunct here.
          # W3C / Python-2.0 / HPND-Markus-Kuhn: pyshacl → owlrl, pyparsing, wcwidth.
          allow-licenses: >-
            MIT,
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            ISC,
            MIT-0,
            BSD-2-Clause,
            BSD-3-Clause,
            Unicode-3.0,
            CC0-1.0,
            Zlib,
            CDLA-Permissive-2.0,
            W3C,
            W3C-20150513,
            Python-2.0,
            HPND-Markus-Kuhn
          allow-dependencies-licenses: >-
            pkg:github/actions/checkout,
            pkg:github/actions/cache,
            pkg:github/actions/setup-python,
            pkg:github/actions/dependency-review-action,
            pkg:github/astral-sh/setup-uv,
            pkg:github/advanced-security/component-detection-dependency-submission-action,
            pkg:cargo/regex-automata,
            pkg:cargo/ratio-core,
            pkg:cargo/ratio-py,
            pkg:pypi/owlrl,
            pkg:pypi/pyparsing,
            pkg:pypi/wcwidth
          comment-summary-in-pr: always
