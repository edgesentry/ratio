[workspace]
resolver = "2"
members = ["crates/ratio-core", "crates/ratio-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/edgesentry/ratio"

[workspace.dependencies]
arrow = { version = "59", default-features = false, features = ["ipc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
