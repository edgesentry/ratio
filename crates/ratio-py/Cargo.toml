[package]
name = "ratio-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings (PyO3) for Ratio core — prototype / SLM side"

[lib]
name = "ratio_py"
crate-type = ["cdylib"]

[dependencies]
ratio-core = { path = "../ratio-core", version = "0.1.0" }
pyo3 = { version = "0.29", features = ["extension-module"] }
serde_json = "1"
