[project]
name = "ratio-poc"
version = "0.1.0"
description = "Minimal Ratio PoC pipeline: stub TD → local raw → shareable product → SHACL → ODS stub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
]

[project.scripts]
ratio-poc = "ratio_poc.cli:main"
ratio-poc-serve = "ratio_poc.industry_serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratio_poc"]

[tool.uv]
package = true
